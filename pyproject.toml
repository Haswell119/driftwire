[project]
name = "driftwire"
version = "0.1.0"
description = "Detect API contract drift: validate your live API against its OpenAPI spec, and catch breaking changes between spec versions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Meridian Digital" }]
dependencies = ["PyYAML>=6.0"]
keywords = ["openapi", "api", "contract-testing", "drift", "breaking-changes", "schema"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
driftwire = "driftwire.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["driftwire*"]
